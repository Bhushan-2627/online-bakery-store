<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Sweet Crumbs</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                🍰 Sweet Crumbs
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <a href="cart.html" class="cart-link">
                🛒 <span id="cart-count">0</span>
            </a>

        </nav>
    </header>


    <!-- Checkout -->
    <section>

        <h2>Checkout</h2>

        <div class="checkout-container">

            <!-- Customer Details -->
            <div class="checkout-form">

                <h3>Customer Details</h3>

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                >

                <label for="phone">Mobile Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your mobile number"
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <label for="address">Delivery Address</label>
                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your delivery address">
                </textarea>

                
<label for="payment">
    Payment Method
</label>

<select id="payment">
    <option value="razorpay">
        Online Payment via Razorpay (UPI, Cards, Netbanking)
    </option>
</select>

                <button
                    class="checkout-btn"
                    onclick="placeOrder()">

                    Place Order

                </button>

            </div>


            <!-- Order Summary -->
            <div class="checkout-summary">

                <h3>Order Summary</h3>

                <div id="order-items">
                </div>

                <hr>

                <h3>
                    Total:
                    ₹<span id="order-total">0</span>
                </h3>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <h2>🍰 Sweet Crumbs</h2>

            <p>
                Freshly baked products made with love.
            </p>

            <p>
                © 2026 Sweet Crumbs. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="js/cart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

   
<script>
const API_BASE_URL = "https://sweet-crumbs-payment-api.bhushankshirsagar075.workers.dev";
let isProcessing = false;

function loadCheckout() {
    const cart = getCart();
    const itemsContainer = document.getElementById("order-items");
    const totalElement = document.getElementById("order-total");

    itemsContainer.replaceChildren();
    let total = 0;

    cart.forEach(product => {
        const lineTotal = product.price * product.quantity;
        total += lineTotal;

        const line = document.createElement("p");
        line.textContent =
            `${product.name} × ${product.quantity} — ₹${lineTotal}`;
        itemsContainer.appendChild(line);
    });

    totalElement.textContent = total.toFixed(2);
}

async function placeOrder() {
    if (isProcessing) return;

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const button = document.querySelector(".checkout-btn");
    const cart = getCart();

    if (!name || !phone || !address) {
        alert("Please enter your name, phone number and delivery address.");
        return;
    }

    if (!/^[0-9+\-\s()]{8,20}$/.test(phone)) {
        alert("Please enter a valid phone number.");
        return;
    }

    if (email && !document.getElementById("email").checkValidity()) {
        alert("Please enter a valid email address.");
        return;
    }

    if (!cart.length) {
        alert("Your cart is empty.");
        return;
    }

    isProcessing = true;
    button.disabled = true;
    button.textContent = "Preparing payment...";

    try {
        const orderResponse = await fetch(
            `${API_BASE_URL}/api/create-order`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    cart,
                    customer: { name, phone, email, address }
                })
            }
        );

        const orderData = await orderResponse.json();

        if (!orderResponse.ok) {
            throw new Error(orderData.error || "Unable to create order.");
        }

        const options = {
            key: orderData.keyId,
            amount: orderData.amount,
            currency: orderData.currency,
            name: "Sweet Crumbs",
            description: "Bakery order",
            order_id: orderData.orderId,
            prefill: { name, email, contact: phone },
            theme: { color: "#8b4b3e" },

            handler: async function (paymentResponse) {
                button.textContent = "Verifying payment...";

                try {
                    const response = await fetch(
                        `${API_BASE_URL}/api/verify-payment`,
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(paymentResponse)
                        }
                    );

                    const result = await response.json();

                    if (!response.ok || result.verified !== true) {
                        alert(
                            "Payment is not confirmed yet. Do not pay again " +
                            "immediately. Check the payment status or contact " +
                            "the store before retrying."
                        );
                        return;
                    }

                    // Local copy for the existing browser-based analytics.
                    // The Supabase record is the server-side order record.
                    const orders = JSON.parse(
                        localStorage.getItem("bakeryOrders") || "[]"
                    );

                    orders.push({
                        orderId: paymentResponse.razorpay_order_id,
                        razorpayPaymentId: paymentResponse.razorpay_payment_id,
                        customerName: name,
                        phone,
                        email,
                        address,
                        paymentMethod: "Razorpay",
                        paymentStatus: "paid",
                        items: cart,
                        total: orderData.amount / 100,
                        orderDate: new Date().toISOString()
                    });

                    localStorage.setItem("bakeryOrders", JSON.stringify(orders));
                    clearCart();

                    alert("Payment verified successfully. Thank you, " + name + "!");
                    window.location.href = "index.html";
                } catch (error) {
                    console.error("Verification error:", error);
                    alert(
                        "Payment status could not be confirmed. If your account " +
                        "was debited, do not pay again; contact the store."
                    );
                } finally {
                    isProcessing = false;
                    button.disabled = false;
                    button.textContent = "Place Order";
                }
            },

            modal: {
                ondismiss: function () {
                    isProcessing = false;
                    button.disabled = false;
                    button.textContent = "Place Order";
                }
            }
        };

        const checkout = new Razorpay(options);

        checkout.on("payment.failed", function (response) {
            alert(
                "Payment failed: " +
                (response.error?.description || "Please try again.")
            );

            isProcessing = false;
            button.disabled = false;
            button.textContent = "Place Order";
        });

        checkout.open();
        button.textContent = "Checkout opened";
    } catch (error) {
        console.error("Checkout error:", error);
        alert(error.message || "Could not start checkout. Please try again.");

        isProcessing = false;
        button.disabled = false;
        button.textContent = "Place Order";
    }
}

document.addEventListener("DOMContentLoaded", loadCheckout);
</script>
</body>
</html>
